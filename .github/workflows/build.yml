name: Build and Release HoyuKey

on:
  push:
    branches: [ "master", "main" ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Calculate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      patch: ${{ steps.ver.outputs.patch }}
    steps:
      - name: Calculate version
        id: ver
        run: |
          RUN_NUM=${{ github.run_number }}
          OFFSET=60
          PATCH=$(( RUN_NUM > OFFSET ? RUN_NUM - OFFSET : 0 ))
          VERSION="1.0.$PATCH"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "patch=$PATCH" >> $GITHUB_OUTPUT
          echo "Calculated version: $VERSION (Build #$PATCH, Run #$RUN_NUM)"

  build-windows:
    name: Build Windows
    needs: version
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set version in Cargo.toml
        shell: powershell
        run: |
          $ver = "${{ needs.version.outputs.version }}"
          (Get-Content Cargo.toml) -replace '^version = ".*"', "version = `"$ver`"" | Set-Content Cargo.toml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Run Tests
        run: cargo test --verbose

      - name: Compile Resource & Build Release Binary
        shell: powershell
        run: |
          rc.exe /fo app.res app.rc
          $env:RUSTFLAGS = "-C link-arg=app.res"
          cargo build --release --bin hoyukey

      - name: Prepare Binary
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/release/hoyukey.exe dist/HoyuKey.exe

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hoyukey-windows
          path: dist/HoyuKey.exe
          retention-days: 5

  build-linux:
    name: Build Linux
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake extra-cmake-modules libfcitx5core-dev libfcitx5utils-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Linux Tests
        run: cargo test -p hoyukey-core -p hoyukey-c -p hoyukey-cli --verbose

      - name: Build Rust Libraries & CLI
        run: cargo build --release -p hoyukey-c -p hoyukey-cli

      - name: Build Fcitx5 HoyuKey Addon
        run: |
          cd crates/fcitx5-hoyukey
          cmake -B build -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Package Linux Distribution (.deb & .tar.gz)
        run: |
          mkdir -p dist-linux/HoyuKey-archive
          cp crates/fcitx5-hoyukey/build/hoyukey.so dist-linux/HoyuKey-archive/
          cp crates/fcitx5-hoyukey/hoyukey.conf dist-linux/HoyuKey-archive/
          cp crates/fcitx5-hoyukey/hoyukey-addon.conf dist-linux/HoyuKey-archive/
          cp crates/fcitx5-hoyukey/scripts/install.sh dist-linux/HoyuKey-archive/
          cp icon/logo.png dist-linux/HoyuKey-archive/hoyukey.png
          chmod +x dist-linux/HoyuKey-archive/install.sh
          tar -czf dist-linux/HoyuKey.tar.gz -C dist-linux HoyuKey-archive

          # Tao goi cai dat 1-cham .deb cho Ubuntu, Debian, Linux Mint
          mkdir -p deb-pkg/DEBIAN
          mkdir -p deb-pkg/usr/lib/fcitx5
          mkdir -p deb-pkg/usr/share/fcitx5/addon
          mkdir -p deb-pkg/usr/share/fcitx5/inputmethod
          mkdir -p deb-pkg/usr/share/icons/hicolor/128x128/apps
          mkdir -p deb-pkg/usr/share/pixmaps

          cp crates/fcitx5-hoyukey/build/hoyukey.so deb-pkg/usr/lib/fcitx5/
          cp crates/fcitx5-hoyukey/hoyukey-addon.conf deb-pkg/usr/share/fcitx5/addon/
          cp crates/fcitx5-hoyukey/hoyukey.conf deb-pkg/usr/share/fcitx5/inputmethod/
          cp icon/logo.png deb-pkg/usr/share/icons/hicolor/128x128/apps/hoyukey.png
          cp icon/logo.png deb-pkg/usr/share/pixmaps/hoyukey.png

          cat << EOF > deb-pkg/DEBIAN/control
          Package: hoyukey
          Version: ${{ needs.version.outputs.version }}
          Section: utils
          Priority: optional
          Architecture: amd64
          Depends: fcitx5
          Maintainer: Hoyuuna
          Description: Bo go Tieng Viet HoyuKey cho Linux (Fcitx5)
           HoyuKey la bo go Tieng Viet sieu nhe, hien dai va on dinh viet bang Rust.
          EOF

          cat << 'EOF' > deb-pkg/DEBIAN/postinst
          #!/bin/sh
          set -e
          if [ -d "/usr/lib/x86_64-linux-gnu/fcitx5" ]; then
              ln -sf /usr/lib/fcitx5/hoyukey.so /usr/lib/x86_64-linux-gnu/fcitx5/hoyukey.so || true
          fi
          if command -v fcitx5-remote >/dev/null 2>&1; then
              fcitx5-remote -r || true
          fi
          exit 0
          EOF
          chmod 755 deb-pkg/DEBIAN/postinst

          dpkg-deb --build deb-pkg dist-linux/HoyuKey.deb

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hoyukey-linux
          path: |
            dist-linux/HoyuKey.deb
            dist-linux/HoyuKey.tar.gz
          retention-days: 5

  publish:
    name: Publish GitHub Release
    needs: [version, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: hoyukey-windows
          path: release-assets

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: hoyukey-linux
          path: release-assets

      - name: Publish GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: "HoyuKey v${{ needs.version.outputs.version }}"
          body: |
            HoyuKey v${{ needs.version.outputs.version }}
            (Phiên bản đa nền tảng được build tự động)

            Phiên bản: ${{ needs.version.outputs.version }}
            Commit: ${{ github.sha }} (Build #${{ needs.version.outputs.patch }})

            | File | Nền tảng | Mô tả |
            | :--- | :--- | :--- |
            | `HoyuKey.exe` | Windows x64 | Chạy trực tiếp (Portable) |
            | `HoyuKey.deb` | Ubuntu / Debian / Linux Mint | Gói cài đặt .deb |
            | `HoyuKey.tar.gz` | Arch Linux / Fedora / Khác | Gói nén cài đặt |

            ---
            ### Hướng dẫn cài đặt trên Windows:
            - Tải file `HoyuKey.exe` về máy và mở chạy trực tiếp.
            - **Tránh bị Windows Security chặn nhầm**: Do phần mềm chưa có chữ ký số, Windows Security có thể nhận diện nhầm. Để phần mềm và tính năng tự động cập nhật hoạt động ổn định:
              1. Tạo một thư mục riêng (ví dụ: `C:\HoyuKey` hoặc `D:\HoyuKey`) và đặt file `HoyuKey.exe` vào đó.
              2. Thêm thư mục trên vào danh sách loại trừ (Exclusion) của Windows:
                 - Mở **Windows Security** -> chọn **Virus & threat protection**.
                 - Tại mục **Virus & threat protection settings**, nhấn **Manage settings**.
                 - Cuộn xuống mục **Exclusions**, nhấn **Add or remove exclusions**.
                 - Nhấn **Add an exclusion** -> chọn **Folder** rồi chọn thư mục bạn vừa tạo.

            ---
            ### Hướng dẫn cài đặt trên Linux:
            - **Với Ubuntu / Debian / Linux Mint**:
              Tải file `HoyuKey.deb`, nhấp đúp chuột vào file rồi chọn **Install** (hoặc mở terminal chạy `sudo dpkg -i HoyuKey.deb`).
            - **Với Arch Linux / Fedora / các bản phân phối khác**:
              Tải file `HoyuKey.tar.gz`, giải nén và chạy:
              ```bash
              tar -xzf HoyuKey.tar.gz
              cd HoyuKey-archive
              chmod +x install.sh
              ./install.sh
              ```
            - Sau khi cài đặt xong, mở **Fcitx5 Configuration** và thêm **HoyuKey** vào danh sách bộ gõ.
          prerelease: true
          draft: false
          files: |
            release-assets/HoyuKey.exe
            release-assets/HoyuKey.deb
            release-assets/HoyuKey.tar.gz
